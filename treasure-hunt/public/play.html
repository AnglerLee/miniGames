<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>홈 트레저헌트 - 미션</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/animations.css">
    <style>
        body {
            overflow: hidden;
        }

        /* ===== S06: Minigame Play ===== */
        .play-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-iframe-wrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .game-iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .game-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .game-loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--theme-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== S07: Find Object ===== */
        .find-container {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 0;
        }

        .find-container.active {
            display: flex;
        }

        .find-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            margin-bottom: 12px;
        }

        .find-story-card {
            background: var(--theme-bg-card);
            border: 1px solid var(--theme-card-border);
            border-radius: 12px;
            padding: 20px 16px;
            margin-bottom: 16px;
        }

        .find-story-card .story-icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
        }

        .find-story-card .story-text {
            color: var(--theme-text);
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .hint-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 80px;
        }

        .hint-card {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .hint-card.hidden-hint {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            justify-content: center;
            cursor: pointer;
            color: var(--theme-text-sub);
            font-size: 0.9rem;
        }

        .hint-card .hint-icon {
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .hint-card .hint-text {
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .answer-section {
            position: sticky;
            bottom: 0;
            padding: 24px 16px 16px 16px;
            margin: 0;
            z-index: 5;
        }

        .answer-row {
            display: flex;
            gap: 8px;
        }

        .answer-row input {
            flex: 1;
        }

        .answer-attempts {
            text-align: center;
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--theme-text-sub);
        }

        .answer-feedback {
            text-align: center;
            margin-top: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .answer-feedback.error {
            color: var(--color-error);
        }

        .answer-feedback.success {
            color: var(--color-success);
        }

        /* ===== Mission Complete Overlay ===== */
        .complete-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .complete-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .complete-card {
            background: var(--theme-bg);
            border: 1px solid var(--theme-card-border);
            border-radius: 16px;
            padding: 30px 24px;
            text-align: center;
            max-width: 340px;
            width: 90%;
        }

        .complete-card .c-icon {
            font-size: 60px;
            margin-bottom: 12px;
        }

        .complete-card .c-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .complete-card .c-clue {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin: 16px 0;
        }

        .complete-card .c-clue .clue-label {
            font-size: 0.8rem;
            color: var(--theme-text-sub);
            margin-bottom: 4px;
        }

        .complete-card .c-clue .clue-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--theme-accent);
        }

        .complete-card .c-message {
            color: var(--theme-text-sub);
            font-size: 0.9rem;
            margin-bottom: 16px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Timer Bar -->
    <div class="timer-bar" id="timerBar" style="display:none;">
        <div class="timer-bar-fill" id="timerFill"></div>
    </div>

    <!-- S06: Minigame (iframe) -->
    <div class="play-container" id="miniPlayContainer" style="display:none;">
        <div class="game-iframe-wrapper">
            <div class="game-loading" id="gameLoading">
                <div class="spinner"></div>
                <p style="margin-top:12px; color:var(--theme-text-sub);">게임 로딩 중...</p>
            </div>
            <iframe id="gameFrame" allow="camera; microphone; accelerometer; gyroscope; vibrate" allowfullscreen></iframe>
        </div>
    </div>

    <!-- S07: Find Object -->
    <div class="find-container" id="findContainer">
        <div class="find-header">
            <button class="btn-icon" id="findBackBtn">←</button>
            <span style="font-weight:600;">물건 찾기 미션</span>
            <div style="width:48px;"></div>
        </div>

        <!-- Story -->
        <div class="find-story-card fade-in">
            <div class="story-icon">📖</div>
            <div class="story-text" id="findStoryText"></div>
        </div>

        <!-- Hints -->
        <div class="hint-section" id="hintSection"></div>

        <button class="btn btn-secondary" id="revealHintBtn" style="display:none;">
            🔍 힌트 꺼내기
        </button>

        <!-- Answer -->
        <div class="answer-section">
            <div class="answer-row">
                <input class="input-field" id="findAnswer" type="text" placeholder="답변을 입력하세요" autocomplete="off">
                <button class="btn btn-primary" id="checkAnswerBtn">확인</button>
            </div>
            <div class="answer-attempts" id="answerAttempts"></div>
            <div class="answer-feedback" id="answerFeedback"></div>
        </div>
    </div>

    <!-- Mission Complete Overlay -->
    <div class="complete-overlay" id="completeOverlay">
        <div class="complete-card scale-in">
            <div class="c-icon" id="completeIcon">🎉</div>
            <div class="c-title" id="completeTitle">미션 완료!</div>

            <div class="c-clue" id="completeClue" style="display:none;">
                <div class="clue-label">획득한 단서</div>
                <div class="clue-value" id="completeClueValue"></div>
            </div>

            <div class="c-message" id="completeMessage"></div>

            <div class="modal-buttons">
                <button class="btn btn-primary" id="nextMissionBtn">▶ 다음 미션</button>
                <button class="btn btn-primary" id="goTreasureFromPlay" style="display:none;">📦 보물 상자</button>
            </div>
        </div>
    </div>

    <!-- Waiting Overlay (Co-op: waiting for other players) -->
    <div class="complete-overlay" id="waitingOverlay">
        <div class="complete-card scale-in" style="max-width:380px;">
            <div class="c-icon" style="font-size:60px;">⏳</div>
            <div class="c-title" style="font-size:1.1rem;">다른 플레이어를 기다리는 중...</div>
            <div id="waitingPlayerList" style="text-align:left; margin:16px 0; font-size:0.95rem; line-height:2;"></div>
            <div class="c-message" style="font-size:0.85rem;">모든 플레이어가 완료하면<br>자동으로 다음 미션으로 이동합니다</div>
        </div>
    </div>

    <script src="js/api-client.js"></script>
    <script src="js/sse-client.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/preset-data.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/game-engine.js"></script>
    <script src="js/app.js"></script>
    <script>
        /* ===== play.html - Mission Play Logic (Co-op Server Version) ===== */
        (async function () {
            const type = App.getQueryParam('type');  // 'mini' or 'find'
            const missionIdx = parseInt(App.getQueryParam('idx')) || 0;
            const pidParam = App.getQueryParam('pid');

            let attempts = 0;
            let revealedHints = 1;
            let timer = null;
            let missionStartTime = Date.now();
            let missionCompleted = false;
            let myPlayerId = null;

            // Init
            await App.init();
            await GameEngine.init();

            // Resolve playerId
            myPlayerId = pidParam || Storage.getMyPlayerId();

            const config = Storage.getCachedConfig();
            if (config && config.theme) {
                ThemeManager.apply(config.theme);
            }

            const mission = GameEngine.getMissionByIndex(missionIdx);
            if (!mission) {
                App.navigate('index.html#hub');
                return;
            }

            if (type === 'mini') {
                initMinigame(mission);
            } else {
                initFindObject(mission);
            }

            /* ===== S06: Minigame ===== */
            function initMinigame(m) {
                document.getElementById('miniPlayContainer').style.display = '';
                document.getElementById('findContainer').classList.remove('active');

                const info = getGameInfo(m.gameId);
                if (!info) {
                    Effects.showToast('게임 정보를 찾을 수 없습니다');
                    return;
                }

                // Load game in iframe - path changed for server version
                const iframe = document.getElementById('gameFrame');
                const gamePath = '/games/' + info.path + '/index.html';

                iframe.onload = function () {
                    document.getElementById('gameLoading').style.display = 'none';

                    // Send theme background to game iframe
                    try {
                        var cs = getComputedStyle(document.documentElement);
                        iframe.contentWindow.postMessage({
                            type: 'THEME_BG',
                            gradient: cs.getPropertyValue('--theme-gradient').trim(),
                            bg: cs.getPropertyValue('--theme-bg').trim()
                        }, '*');
                    } catch (e) { /* cross-origin safe */ }
                };

                iframe.src = gamePath;

                // Listen for postMessage from game
                window.addEventListener('message', handleGameMessage);
            }

            async function handleGameMessage(event) {
                const data = event.data;
                if (!data || !data.type) return;

                // Prevent duplicate completion
                if (missionCompleted) return;

                var completionTypes = [
                    'GAME_CLEAR',
                    'treasureHuntGameComplete',
                    'treasureHuntComplete'
                ];

                if (completionTypes.indexOf(data.type) !== -1) {
                    missionCompleted = true;
                    if (timer) timer.stop();
                    window.removeEventListener('message', handleGameMessage);

                    var elapsed = Math.floor((Date.now() - missionStartTime) / 1000);

                    // Co-op mode: report to server with playerId
                    if (myPlayerId && GameEngine.getPlayerCount() >= 2) {
                        var response = await GameEngine.completeMission(myPlayerId, {
                            attempts: attempts + 1,
                            time: elapsed
                        });
                        await showMissionComplete(mission, response);
                    } else {
                        // Solo mode: legacy behavior
                        await GameEngine.completeMission(myPlayerId, {
                            attempts: attempts + 1,
                            time: elapsed
                        });
                        await showMissionComplete(mission, null);
                    }
                }
            }

            /* ===== S07: Find Object ===== */
            function initFindObject(m) {
                document.getElementById('miniPlayContainer').style.display = 'none';
                document.getElementById('findContainer').classList.add('active');

                // Story
                document.getElementById('findStoryText').textContent = m.storyText || '물건을 찾아보세요!';

                // Hints
                renderHints(m);

                // Auto-scroll and focus handling for answer input
                var answerInput = document.getElementById('findAnswer');
                var answerSection = document.querySelector('.answer-section');

                setTimeout(function() {
                    if (answerSection) {
                        answerSection.scrollIntoView({
                            behavior: 'smooth',
                            block: 'end',
                            inline: 'nearest'
                        });
                    }
                }, 400);

                answerInput.addEventListener('focus', function() {
                    setTimeout(function() {
                        answerInput.scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }, 300);
                });

                // Back button
                App.addUnifiedEvent(document.getElementById('findBackBtn'), function () {
                    App.navigate('index.html#hub');
                });
            }

            function renderHints(m) {
                const section = document.getElementById('hintSection');
                section.innerHTML = '';

                const hints = m.hints || [];
                const revealBtn = document.getElementById('revealHintBtn');

                hints.forEach(function (hint, i) {
                    if (i < revealedHints) {
                        const card = document.createElement('div');
                        card.className = 'hint-card fade-in-up';
                        card.style.animationDelay = (i * 0.15) + 's';
                        card.innerHTML =
                            '<span class="hint-icon">💡</span>' +
                            '<span class="hint-text">힌트 ' + (i + 1) + ': ' + App.escapeHtml(hint) + '</span>';
                        section.appendChild(card);
                    }
                });

                if (revealedHints < hints.length) {
                    revealBtn.style.display = '';
                } else {
                    revealBtn.style.display = 'none';
                }
            }

            // Reveal Hint
            App.addUnifiedEvent(document.getElementById('revealHintBtn'), async function () {
                if (!mission.hints) return;
                revealedHints++;
                await GameEngine.useHint(missionIdx);
                renderHints(mission);
                Effects.playSound('reveal');
                Effects.vibrateClick();
            });

            // Check Answer
            App.addUnifiedEvent(document.getElementById('checkAnswerBtn'), function () {
                checkAnswer();
            });

            document.getElementById('findAnswer').addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    checkAnswer();
                }
            });

            async function checkAnswer() {
                const input = document.getElementById('findAnswer');
                const raw = input.value.trim();
                if (!raw) return;

                attempts++;
                const normalized = raw.replace(/\s/g, '').toLowerCase();
                const answers = (mission.answers || []).map(function (a) {
                    return a.replace(/\s/g, '').toLowerCase();
                });

                const feedback = document.getElementById('answerFeedback');

                if (answers.indexOf(normalized) !== -1) {
                    // Correct!
                    missionCompleted = true;
                    Effects.playSound('success');
                    Effects.vibrateSuccess();
                    feedback.textContent = '정답입니다!';
                    feedback.className = 'answer-feedback success';

                    const elapsed = Math.floor((Date.now() - missionStartTime) / 1000);
                    var response = await GameEngine.completeMission(myPlayerId, {
                        attempts: attempts,
                        time: elapsed
                    });

                    setTimeout(async function () {
                        await showMissionComplete(mission, response);
                    }, 800);
                } else {
                    // Wrong
                    Effects.playSound('fail');
                    Effects.vibrateFail();
                    feedback.textContent = '오답입니다. 다시 시도해보세요!';
                    feedback.className = 'answer-feedback error';
                    input.value = '';
                    input.classList.add('shake');
                    setTimeout(function () { input.classList.remove('shake'); }, 500);

                    setTimeout(function() {
                        feedback.scrollIntoView({
                            behavior: 'smooth',
                            block: 'nearest'
                        });
                    }, 100);

                    document.getElementById('answerAttempts').textContent = '시도: ' + attempts;

                    // Auto reveal hints after 3 failures
                    if (attempts >= 3 && mission.hints && revealedHints < mission.hints.length) {
                        revealedHints = mission.hints.length;
                        renderHints(mission);
                        Effects.showToast('모든 힌트가 공개되었습니다!');
                    }
                }
            }

            /* ===== Mission Complete ===== */
            async function showMissionComplete(m, serverResponse) {
                Effects.createConfetti(3000);
                Effects.playSound('success');
                Effects.vibrateSuccess();

                // Dim iframe so the overlay is clearly visible
                var iframeWrapper = document.getElementById('miniPlayContainer');
                if (iframeWrapper) iframeWrapper.style.opacity = '0.3';

                const overlay = document.getElementById('completeOverlay');
                document.getElementById('completeIcon').textContent = '🎉';

                // Show player name in co-op mode
                if (GameEngine.getPlayerCount() >= 2 && myPlayerId) {
                    var myName = GameEngine.getPlayerNameById(myPlayerId) || Storage.getMyPlayerName() || '';
                    document.getElementById('completeTitle').textContent = myName + ' 미션 완료!';
                } else {
                    document.getElementById('completeTitle').textContent = '미션 완료!';
                }
                document.getElementById('completeMessage').textContent = m.successMessage || '잘했어요!';

                // Show clue
                if (m.clue && m.clue.content) {
                    document.getElementById('completeClue').style.display = '';
                    document.getElementById('completeClueValue').textContent = m.clue.content;
                }

                // Co-op mode: check if we need to wait or auto-advance
                var isCoopMode = GameEngine.getPlayerCount() >= 2;

                if (isCoopMode) {
                    // In co-op, check server response for advancement info
                    if (serverResponse && serverResponse.allComplete) {
                        // All players done for this mission
                        if (serverResponse.gameComplete) {
                            // All missions done!
                            document.getElementById('nextMissionBtn').style.display = 'none';
                            document.getElementById('goTreasureFromPlay').style.display = '';
                        } else {
                            // Next mission available
                            document.getElementById('nextMissionBtn').style.display = '';
                            document.getElementById('goTreasureFromPlay').style.display = 'none';
                        }
                    } else {
                        // Not all done yet → show waiting overlay after a brief delay
                        document.getElementById('nextMissionBtn').style.display = 'none';
                        document.getElementById('goTreasureFromPlay').style.display = 'none';

                        // Show complete overlay briefly, then switch to waiting
                        overlay.classList.add('active');
                        setTimeout(function () {
                            overlay.classList.remove('active');
                            showWaitingOverlay();
                        }, 2000);
                        return;
                    }
                } else {
                    // Solo mode: check normally
                    await GameEngine.init();
                    if (GameEngine.isAllCompleted()) {
                        document.getElementById('nextMissionBtn').style.display = 'none';
                        document.getElementById('goTreasureFromPlay').style.display = '';
                    } else {
                        document.getElementById('nextMissionBtn').style.display = '';
                        document.getElementById('goTreasureFromPlay').style.display = 'none';
                    }
                }

                overlay.classList.add('active');
            }

            /* ===== Waiting Overlay (Co-op) ===== */
            function showWaitingOverlay() {
                var waitingOverlay = document.getElementById('waitingOverlay');
                updateWaitingList();
                waitingOverlay.classList.add('active');
            }

            function updateWaitingList() {
                var listEl = document.getElementById('waitingPlayerList');
                if (!listEl) return;
                listEl.innerHTML = '';

                var statuses = GameEngine.getMissionPlayerStatuses(missionIdx);
                Object.keys(statuses).forEach(function (pid) {
                    var s = statuses[pid];
                    var isMe = (pid === myPlayerId);
                    var icon = '🎮';
                    var text = '플레이 중...';

                    if (s.status === 'cleared') {
                        icon = '✅';
                        text = '완료!';
                    } else if (!s.connected) {
                        icon = '⚪';
                        text = '미접속';
                    }

                    var item = document.createElement('div');
                    item.style.cssText = 'display:flex; align-items:center; gap:8px;';
                    item.innerHTML =
                        '<span>' + icon + '</span>' +
                        '<span style="font-weight:600;' + (isMe ? 'color:var(--theme-accent);' : '') + '">' +
                        App.escapeHtml(s.name) + (isMe ? ' (나)' : '') + '</span>' +
                        '<span style="margin-left:auto; font-size:0.8rem; color:var(--theme-text-sub);">' + text + '</span>';
                    listEl.appendChild(item);
                });
            }

            // Next Mission
            App.addUnifiedEvent(document.getElementById('nextMissionBtn'), function () {
                Effects.playSound('click');
                App.navigate('index.html#hub');
            });

            // Go to Treasure
            App.addUnifiedEvent(document.getElementById('goTreasureFromPlay'), function () {
                Effects.playSound('click');
                App.navigate('treasure.html');
            });

            /* ===== SSE: Co-op Events on play.html ===== */

            // Another player completed the same mission
            SSEClient.on('player_mission_complete', function (data) {
                if (data.state) GameEngine.updateState(data.state);
                // Update waiting list if visible
                if (document.getElementById('waitingOverlay').classList.contains('active')) {
                    updateWaitingList();
                }
            });

            // All players completed → advance to next mission
            SSEClient.on('mission_advance', function (data) {
                if (data.state) GameEngine.updateState(data.state);

                // Hide waiting overlay and go to hub
                document.getElementById('waitingOverlay').classList.remove('active');
                Effects.playSound('success');
                Effects.showToast('모든 플레이어 완료! 다음 미션으로 이동합니다.');

                setTimeout(function () {
                    App.navigate('index.html#hub');
                }, 1500);
            });

            // All missions complete → go to treasure
            SSEClient.on('all_missions_complete', function (data) {
                if (data.state) GameEngine.updateState(data.state);

                document.getElementById('waitingOverlay').classList.remove('active');
                Effects.playSound('success');
                Effects.showToast('모든 미션 완료! 보물 상자로 이동합니다!');

                setTimeout(function () {
                    App.navigate('treasure.html');
                }, 1500);
            });

            // Game reset by admin
            SSEClient.on('game_reset', function () {
                App.navigate('index.html');
            });

            // New game started by admin while player is on play page
            // → stop heartbeat, clear stale session, redirect to player select
            SSEClient.on('game_started', function () {
                App.stopHeartbeat();
                Storage.clearMyPlayer();
                Effects.showToast('새 게임이 시작되었습니다. 플레이어를 다시 선택해주세요.');
                setTimeout(function () {
                    App.navigate('index.html');
                }, 1500);
            });

        })();
    </script>
</body>
</html>
