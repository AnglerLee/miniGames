<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19 Reverse Audio - 관리자 설정</title>
    <link rel="stylesheet" href="../../assets/css/admin-theme.css">
    <style>
        /* ── 모바일 body padding 보정 ── */
        @media (max-width: 640px) {
            body { padding: 1rem; }
            .admin-header { margin-bottom: 1.5rem; padding: 1rem 0; }
            .admin-header h1 { font-size: 1.6rem; }
            .admin-form-card { padding: 1rem; }
        }

        /* ── 난이도 라벨 ── */
        .difficulty-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.85rem;
            color: #6b7280;
        }

        /* ── 설정 그리드: 2열 → 모바일 1열 ── */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0;
        }
        @media (max-width: 500px) {
            .settings-grid { grid-template-columns: 1fr; gap: 8px; }
        }

        /* ── 섹션 카드 ── */
        .section-card {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section-card h3 {
            margin: 0 0 14px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #374151;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
        }

        /* ── 문제 목록 헤더 (제목 + 추가 버튼 나란히) ── */
        .list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5e7eb;
        }
        .list-header h3 {
            margin: 0;
            padding: 0;
            border: none;
            font-size: 0.95rem;
            font-weight: 700;
            color: #374151;
        }
        .btn-add-open {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-add-open:hover { background: var(--primary-hover); }

        /* ── 문제 목록 ── */
        .question-list {
            max-height: 260px;
            overflow-y: auto;
        }
        .question-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            margin-bottom: 6px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .question-number {
            min-width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            font-weight: 700;
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .question-answer {
            flex: 1;
            font-size: 0.95rem;
            color: #1f2937;
            word-break: break-all;
        }
        .btn-play-small,
        .btn-delete-small {
            padding: 5px 10px;
            font-size: 0.85rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }
        .btn-play-small   { background: var(--success-color); color: white; }
        .btn-delete-small { background: var(--danger-color);  color: white; }
        .btn-play-small:hover,
        .btn-delete-small:hover { opacity: 0.8; }

        /* ── 빈 상태 ── */
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
        }
        .empty-state-icon { font-size: 2.5rem; margin-bottom: 8px; }

        /* ── 속도 라벨 ── */
        .speed-label {
            text-align: center;
            margin-top: 4px;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--primary-color);
        }

        /* ══════════════════════════════════
           모달
        ══════════════════════════════════ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }
        .modal-overlay.hidden { display: none !important; }

        .modal-card {
            background: white;
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            background: #f8fafc;
        }
        .modal-header h3 {
            margin: 0;
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #6b7280;
            padding: 4px 8px;
            border-radius: 6px;
            line-height: 1;
        }
        .modal-close:hover { background: #f3f4f6; color: #111827; }

        .modal-body { padding: 20px; }

        .modal-notice {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            color: #1d4ed8;
        }

        /* ── 녹음 컨트롤 ── */
        .recording-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .btn-record, .btn-stop, .btn-play {
            padding: 10px 18px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .btn-record { background: var(--danger-color); color: white; }
        .btn-stop   { background: #6b7280; color: white; }
        .btn-play   { background: var(--success-color); color: white; }
        .btn-record:hover,
        .btn-stop:hover,
        .btn-play:hover { opacity: 0.85; }

        .recording-time {
            padding: 6px 14px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            font-weight: 700;
            color: var(--danger-color);
            font-size: 0.9rem;
        }

        .hidden { display: none !important; }
    </style>
</head>

<body>
    <div class="container">
        <a href="../../admin.html" class="main-link">← 전체 게임 목록</a>

        <header class="admin-header">
            <h1>🔧 Reverse Audio 설정</h1>
            <div class="subtitle">난이도별 문제 녹음 및 관리</div>
        </header>

        <div class="admin-form-card">

            <!-- ① 난이도 선택 -->
            <h2 style="font-size:1rem; font-weight:700; color:#111827; margin:0 0 12px;">🎮 난이도 선택</h2>
            <div class="form-group">
                <input type="range" id="difficultySlider" min="0" max="2" step="1" value="0" class="form-input">
                <div class="difficulty-labels">
                    <span>🟢 쉬움</span>
                    <span>🟡 보통</span>
                    <span>🔴 어려움</span>
                </div>
            </div>

            <!-- ② 난이도별 설정 -->
            <div class="section-card">
                <h3 id="currentDifficultyName">🟢 쉬움 난이도 설정</h3>
                <div class="settings-grid">
                    <div class="form-group" style="margin-bottom:0;">
                        <label for="questions">문제 수</label>
                        <input type="number" id="questions" min="1" max="10" value="3" class="form-input">
                        <small style="color:#6b7280;">게임당 출제 문제 수</small>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label for="maxHints">최대 힌트 수</label>
                        <input type="number" id="maxHints" min="0" max="5" value="3" class="form-input">
                        <small style="color:#6b7280;">게임 전체 사용 가능 힌트</small>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label for="playDirection">재생 방향</label>
                        <select id="playDirection" class="form-input">
                            <option value="reverse">⏪ 역방향 (거꾸로)</option>
                            <option value="forward">⏩ 정방향</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom:0;">
                        <label for="playSpeed">재생 속도</label>
                        <input type="range" id="playSpeed" min="0.05" max="2.0" step="0.05" value="0.25" class="form-input">
                        <div id="playSpeedLabel" class="speed-label">0.25x</div>
                    </div>
                </div>

                <button type="button" id="saveSettingsBtn" class="btn btn-save" style="width:100%; margin-top:16px;">💾 설정 저장</button>
            </div>

            <!-- ③ 등록된 문제 목록 -->
            <div class="section-card">
                <div class="list-header">
                    <h3>📝 등록된 문제 (<span id="questionCount">0</span>개) <small style="font-weight:400; color:#9ca3af; font-size:0.8rem;">· 모든 난이도 공통</small></h3>
                    <button type="button" class="btn-add-open" onclick="openAddModal()">➕ 문제 추가</button>
                </div>
                <div id="questionList" class="question-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">🎙️</div>
                        <div>등록된 문제가 없습니다.</div>
                        <div style="margin-top:4px; font-size:0.85rem;">우측 상단 버튼으로 추가해주세요.</div>
                    </div>
                </div>
            </div>

            <!-- 하단 네비게이션 -->
            <div class="btn-group">
                <button type="button" class="btn btn-home" onclick="location.href='index.html'">▶️ 게임으로</button>
            </div>

        </div>
    </div>

    <!-- ══ 문제 추가 모달 ══ -->
    <div id="addQuestionModal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>🎙️ 새 문제 추가</h3>
                <button class="modal-close" onclick="closeAddModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-notice">
                    문제를 추가하면 <strong>즉시 서버에 저장</strong>됩니다.<br>
                    난이도 설정(문제 수·힌트 등)과는 별개입니다.
                </div>

                <div class="form-group">
                    <label for="newAnswer">정답 단어</label>
                    <input type="text" id="newAnswer" placeholder="예: 사과, 냉장고, 문을 열어라" class="form-input">
                </div>

                <label style="display:block; font-weight:600; color:#374151; margin-bottom:8px;">음성 녹음 (최대 5초)</label>
                <div class="recording-controls">
                    <button type="button" id="recordBtn" class="btn-record">🎙️ 녹음 시작</button>
                    <button type="button" id="stopRecordBtn" class="btn-stop hidden">⏹️ 중지</button>
                    <button type="button" id="playBtn" class="btn-play hidden">▶️ 재생</button>
                    <div id="recordingTime" class="recording-time hidden">0.0초</div>
                </div>

                <button type="button" id="addQuestionBtn" class="btn btn-save" disabled style="width:100%; margin-top:8px;">문제 추가 (즉시 저장)</button>
            </div>
        </div>
    </div>

    <script src="../../assets/js/common.js"></script>
    <script src="admin.js"></script>
</body>

</html>
