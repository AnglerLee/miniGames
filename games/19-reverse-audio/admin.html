<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리버스 오디오 - 관리자 설정</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../assets/css/admin-theme.css">
    <style>
        /* 녹음 문제 */
        .ra-count {
            margin-left: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--secondary-color);
        }

        .ra-box {
            margin-bottom: 1.5rem;
        }

        .ra-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .ra-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: #f5f3ff;
            border: 1px solid #e9e5ff;
        }

        .ra-row.broken {
            opacity: 0.55;
        }

        .ra-num {
            flex: none;
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            background: var(--primary-color);
        }

        .ra-main {
            flex: 1 1 80px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
        }

        .ra-answer {
            max-width: 100%;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ra-acts {
            flex: none;
            display: flex;
            gap: 5px;
            margin-left: auto;
        }

        .ra-tag {
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .ra-tag.lv0 {
            background: #d1fae5;
            color: #065f46;
        }

        .ra-tag.lv1 {
            background: #fef3c7;
            color: #92400e;
        }

        .ra-tag.lv2 {
            background: #fee2e2;
            color: #991b1b;
        }

        .ra-icon {
            flex: none;
            min-width: 40px;
            height: 42px;
            padding: 0 6px;
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-size: 0.95rem;
            color: #fff;
            background: var(--success-color);
            cursor: pointer;
        }

        .ra-icon.del {
            background: #fff;
            color: var(--danger-color);
            border: 1px solid #fecaca;
            font-size: 0.8rem;
        }

        .ra-empty {
            padding: 1.4rem 1rem;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--secondary-color);
            border: 2px dashed #e5e7eb;
            border-radius: 12px;
        }

        .ra-empty b {
            display: block;
            font-size: 2rem;
        }

        .ra-new {
            padding: 1rem;
            border-radius: 12px;
            background: #fafafa;
            border: 1px solid #eee;
        }

        .ra-new label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .ra-rec-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 0.8rem 0;
        }

        .ra-rec-row .btn,
        .ra-add {
            padding: 10px 14px;
            font-size: 0.92rem;
        }

        .ra-rec {
            background: var(--danger-color);
            color: #fff;
        }

        .ra-rec.on {
            background: #374151;
        }

        .ra-small {
            background: #fff;
            color: var(--primary-color);
            border: 1px solid #c7d2fe;
        }

        .ra-add {
            width: 100%;
            background: var(--primary-color);
            color: #fff;
        }

        .ra-new .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .ra-time {
            font-weight: 700;
            color: var(--danger-color);
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>

<body>
    <script src="../../assets/js/admin-kit.js"></script>
    <script src="admin.js"></script>
</body>

</html>
