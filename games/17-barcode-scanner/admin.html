<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바코드 몬스터 - 관리자 설정</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../assets/css/admin-theme.css">
    <style>
        /* 숨긴 물건 바코드 (황금 몬스터) */
        .bm-box {
            margin-bottom: 1.5rem;
        }

        .bm-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .bm-row .form-input {
            flex: 1;
            min-width: 0;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        .bm-btn {
            flex: none;
            min-height: 44px;
            padding: 0 14px;
            border: 0;
            border-radius: 10px;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: var(--primary-color);
            cursor: pointer;
        }

        .bm-btn.sub {
            flex: 1;
            min-width: 0;
            padding: 0 8px;
            white-space: nowrap;
            color: var(--primary-color);
            background: #eef2ff;
        }

        .bm-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .bm-status {
            min-height: 1.2em;
            margin: 4px 0 8px;
            font-size: 0.85rem;
            color: var(--secondary-color);
            text-align: center;
        }

        .bm-cambox {
            position: relative;
            display: none;
            width: 100%;
            max-width: 420px;
            height: 260px;
            margin: 0 auto 10px;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
        }

        .bm-cambox.on {
            display: block;
        }

        .bm-cambox video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bm-guide {
            position: absolute;
            left: 7%;
            right: 7%;
            top: 28%;
            bottom: 28%;
            border: 3px solid #2ecc71;
            border-radius: 10px;
            pointer-events: none;
        }

        .bm-stop {
            position: absolute;
            right: 10px;
            bottom: 10px;
            min-height: 40px;
            padding: 0 16px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: var(--danger-color);
            cursor: pointer;
        }

        .bm-list {
            display: grid;
            gap: 8px;
        }

        .bm-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #fff;
        }

        .bm-item.new {
            border-color: var(--primary-color);
            background: #eef2ff;
        }

        .bm-item-text {
            flex: 1;
            min-width: 0;
        }

        .bm-item-code {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 1rem;
            font-weight: 700;
            word-break: break-all;
        }

        .bm-item-mon {
            font-size: 0.85rem;
            color: var(--secondary-color);
        }

        .bm-del {
            flex: none;
            min-height: 38px;
            padding: 0 12px;
            border: 1px solid var(--danger-color);
            border-radius: 8px;
            font: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--danger-color);
            background: #fff;
            cursor: pointer;
        }

        .bm-del.armed {
            color: #fff;
            background: var(--danger-color);
        }

        .bm-empty {
            padding: 16px;
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }
    </style>
</head>

<body>
    <!-- game.js 에서 바코드 읽기와 몬스터 미리보기 도구만 꺼내 쓴다 (엔진을 불러오지 않으면 게임은 만들지 않는다) -->
    <script src="game.js"></script>
    <script src="../../assets/js/admin-kit.js"></script>
    <script src="admin.js"></script>
</body>

</html>
