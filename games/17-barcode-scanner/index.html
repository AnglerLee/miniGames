<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바코드 스캐너 📱</title>
    <link rel="stylesheet" href="../../assets/css/common.css">
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    <style>
        /* 컴팩트한 통계 표시 */
        .stats-compact {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 12px 0;
        }

        .stat-mini {
            background: white;
            padding: 8px 6px;
            border-radius: 8px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-mini-label {
            font-size: 10px;
            color: var(--text-light);
            margin-bottom: 2px;
        }

        .stat-mini-value {
            font-size: 16px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        /* 미션 표시 간소화 */
        .mission-compact {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 12px;
            margin: 12px 0;
            text-align: center;
            box-shadow: var(--shadow-lg);
        }

        .mission-compact-text {
            font-size: 16px;
            font-weight: bold;
        }

        /* 카메라 뷰 최적화 */
        .camera-view {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 12px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            display: none;
        }

        .camera-view.active {
            display: block;
        }

        #scanner-container {
            position: relative;
            width: 100%;
            height: 300px;
        }

        #scanner-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 스캔 가이드 */
        .scan-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 100px;
            border: 2px solid #2ecc71;
            border-radius: 8px;
            z-index: 10;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
            animation: scanLine 2s ease-in-out infinite;
            z-index: 11;
            pointer-events: none;
        }

        @keyframes scanLine {

            0%,
            100% {
                transform: translateY(-50px);
                opacity: 0.3;
            }

            50% {
                transform: translateY(50px);
                opacity: 1;
            }
        }

        .scan-status {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            z-index: 12;
        }

        .scan-status.success {
            background: rgba(46, 204, 113, 0.9);
        }

        /* 수동 입력 컴팩트 */
        .manual-input-compact {
            display: flex;
            gap: 6px;
            margin: 12px 0;
        }

        .manual-input-compact input {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            font-family: monospace;
        }

        .manual-input-compact button {
            padding: 10px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            font-size: 14px;
        }

        /* 액션 버튼 */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin: 12px 0;
        }

        .action-btn {
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .action-btn.primary {
            background: var(--primary-color);
            color: white;
        }

        .action-btn.secondary {
            background: var(--secondary-color);
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* 상태 메시지 */
        .status-message {
            font-size: 13px;
            font-weight: 500;
            margin: 10px 0;
            min-height: 18px;
            text-align: center;
        }

        .status-message.success {
            color: var(--success-color);
        }

        .status-message.error {
            color: var(--danger-color);
        }

        /* 성공 체크마크 */
        .success-checkmark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 80px;
            height: 80px;
            background: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            pointer-events: none;
        }

        .success-checkmark.show {
            animation: checkmarkPop 0.5s ease-out forwards;
        }

        @keyframes checkmarkPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .success-checkmark::before {
            content: '✓';
            font-size: 48px;
            color: white;
            font-weight: bold;
        }

        /* 힌트 목록 */
        .hint-list-section {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 10px;
            padding: 12px 14px;
            margin: 10px 0;
        }
        .hint-list-title {
            font-size: 13px;
            font-weight: 700;
            color: #92400e;
            margin-bottom: 8px;
        }
        .hint-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 14px;
            color: #374151;
            border-bottom: 1px solid #fde68a;
        }
        .hint-item:last-child { border-bottom: none; }
        .hint-item.found {
            color: #9ca3af;
            text-decoration: line-through;
        }
        .hint-num {
            min-width: 22px;
            height: 22px;
            background: #fbbf24;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .hint-item.found .hint-num { background: #10b981; }

        /* 타이머 중앙 표시 */
        .timer-display {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: var(--warning-color);
            margin: 15px 0;
            display: none;
        }

        .timer-display.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="game-header">
            <h1 class="game-title">📱 바코드 스캐너</h1>

        </div>

        <div class="game-area">
            <!-- 타이머 -->
            <div class="timer-display" id="timerDisplay">00:00</div>

            <!-- 통계 (컴팩트) -->
            <div class="stats-compact">
                <div class="stat-mini">
                    <div class="stat-mini-label">시도</div>
                    <div class="stat-mini-value" id="scanAttempts">0</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-label">성공</div>
                    <div class="stat-mini-value" style="color: var(--success-color);" id="successScans">0</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-label">진행</div>
                    <div class="stat-mini-value" style="color: var(--primary-color);" id="missionProgress">0/1</div>
                </div>
                <div class="stat-mini">
                    <div class="stat-mini-label">남은</div>
                    <div class="stat-mini-value" style="color: var(--secondary-color);" id="remaining">1</div>
                </div>
            </div>

            <!-- 미션 표시 (간소화) -->
            <div class="mission-compact" id="missionCompact">
                <div class="mission-compact-text" id="missionText">📱 바코드를 찾으세요</div>
            </div>

            <!-- 힌트 목록 -->
            <div class="hint-list-section" id="hintListSection" style="display:none;">
                <div class="hint-list-title">💡 힌트 목록</div>
                <div id="hintList"></div>
            </div>

            <!-- 카메라 뷰 -->
            <div class="camera-view" id="cameraView">
                <div id="scanner-container">
                    <div class="scan-guide"></div>
                    <div class="scan-line"></div>
                    <div class="scan-status" id="scanStatus">바코드를 가까이 대주세요</div>
                </div>
            </div>

            <!-- 수동 입력 -->
            <div class="manual-input-compact">
                <input type="text" id="manualInput" placeholder="바코드 번호 입력" maxlength="13">
                <button id="manualSubmitBtn">확인</button>
            </div>

            <!-- 상태 메시지 -->
            <div class="status-message" id="statusMessage">카메라를 시작하세요</div>

            <!-- 액션 버튼 -->
            <div class="action-buttons">
                <button class="action-btn primary" id="startCameraBtn">📷 카메라 시작</button>
                <button class="action-btn secondary" id="stopCameraBtn" style="display: none;">⏹️ 정지</button>
                <button class="action-btn secondary" id="resetBtn">🔄 재시작</button>
            </div>
        </div>
    </div>

    <!-- 성공 체크마크 -->
    <div class="success-checkmark" id="successCheckmark"></div>

    <script src="../../assets/js/common.js"></script>
    <script src="game.js"></script>
</body>

</html>
