<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복권 긁기 - 관리자 설정</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../../assets/css/admin-theme.css">
    <style>
        /* 보물 단서 사진 */
        .sc-photo-box {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .sc-badge {
            display: inline-block;
            margin-bottom: 0.8rem;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .sc-badge.off {
            background: #fef3c7;
            color: #92400e;
        }

        .sc-badge.on {
            background: #d1fae5;
            color: #065f46;
        }

        .sc-preview {
            width: 100%;
            max-width: 320px;
            height: 220px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 12px;
            border: 2px dashed #d1d5db;
            background: linear-gradient(135deg, #7a4ad9, #3b1f8f);
        }

        .sc-preview.has {
            border-style: solid;
            border-color: var(--primary-color);
            background: #111827;
        }

        .sc-preview img {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sc-preview.has img {
            display: block;
        }

        .sc-preview.has .sc-empty {
            display: none;
        }

        .sc-empty {
            color: #fff;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .sc-empty b {
            display: block;
            font-size: 2.2rem;
            line-height: 1.3;
        }

        .sc-photo-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 0.6rem;
        }

        .sc-photo-btns .btn {
            flex: 1 1 140px;
            max-width: 190px;
            padding: 10px 14px;
            font-size: 0.92rem;
        }

        .sc-pick {
            background-color: var(--primary-color);
            color: #fff;
        }

        .sc-pick:hover {
            background-color: var(--primary-hover);
        }

        .sc-remove {
            background-color: #fff;
            color: var(--danger-color);
            border: 1px solid #fee2e2;
        }

        .sc-remove:hover {
            background-color: #fef2f2;
            border-color: var(--danger-color);
        }

        .sc-photo-btns .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .sc-photo-box .ak-help {
            text-align: left;
        }

        /* 직접 촬영 화면 */
        .sc-camera {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .sc-camera.on {
            display: flex;
        }

        .sc-camera video {
            width: 100%;
            max-width: 560px;
            max-height: 78vh;
            object-fit: contain;
        }

        .sc-camera-bar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }

        .sc-shutter {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 5px solid #cbd5e1;
            background: #fff;
            cursor: pointer;
        }

        .sc-close {
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #fff;
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
            font: inherit;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <script src="../../assets/js/admin-kit.js"></script>
    <script src="admin.js"></script>
</body>

</html>
