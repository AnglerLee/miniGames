<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니게임 관리자</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/css/admin-theme.css">
    <style>
        .top-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: -1.5rem 0 2rem;
        }

        .top-links a {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            box-shadow: var(--shadow-md);
        }

        .top-links .hunt {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        }

        .top-links .vault {
            background: linear-gradient(135deg, #3b82f6 0%, #4338ca 100%);
        }

        .game-card .need {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 0.75rem;
            color: #4338ca;
            background: #eef2ff;
            vertical-align: middle;
        }

        .game-card .tag {
            margin: 0.3rem 0 0;
            font-size: 0.9rem;
            color: var(--secondary-color);
        }

        .game-card .stars {
            margin-top: 0.4rem;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .game-card .play {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-color);
            text-decoration: none;
        }

        .danger {
            margin-top: 2.5rem;
            text-align: center;
        }

        .danger button {
            border: 0;
            background: none;
            font: inherit;
            color: var(--danger-color);
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="main-link">← 게임 목록으로</a>

        <header class="admin-header">
            <h1>미니게임 관리자</h1>
            <div class="subtitle">게임마다 난이도와 부모가 정하는 값을 설정합니다</div>
        </header>

        <div class="top-links">
            <a class="hunt" href="treasure-hunt3/admin.html">🎯 보물찾기 관리</a>
            <a class="vault" href="operation-vault/index.html">🕶️ 작전명 스낵 볼트</a>
        </div>

        <div class="dashboard-grid" id="grid"></div>

        <div class="danger">
            <button type="button" id="clearRecords">모든 게임의 별과 최고 기록 지우기</button>
        </div>
    </div>

    <script src="assets/js/games-list.js"></script>
    <script>
        // 게임 카드는 assets/js/games-list.js 의 목록으로 만든다
        (function () {
            'use strict';
            let records = {};
            try {
                records = JSON.parse(localStorage.getItem('arcade_records')) || {};
            } catch (e) {
                records = {};
            }

            const grid = document.getElementById('grid');
            window.ARCADE_GAMES.forEach(function (g) {
                const rec = records[g.id] || {};
                const stars = rec.stars || 0;
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML =
                    '<div class="card-icon"></div>' +
                    '<div class="card-content">' +
                    '<span class="game-id"></span>' +
                    '<h3></h3>' +
                    '<p class="tag"></p>' +
                    '<div class="stars"></div>' +
                    '<a class="play">게임 열기 →</a>' +
                    '</div>' +
                    '<a class="btn-config"><span>설정하기</span></a>';
                card.querySelector('.card-icon').textContent = g.icon;
                card.querySelector('.game-id').textContent = 'Game ' + g.id.replace('game', '');
                const title = card.querySelector('h3');
                title.textContent = g.name;
                if (g.need) {
                    const need = document.createElement('span');
                    need.className = 'need';
                    need.textContent = g.need;
                    title.appendChild(need);
                }
                card.querySelector('.tag').textContent = g.tag;
                card.querySelector('.stars').textContent =
                    '⭐'.repeat(stars) + '☆'.repeat(3 - stars) + (rec.plays ? '  ' + rec.plays + '판' : '');
                card.querySelector('.play').href = 'games/' + g.path + '/index.html';
                card.querySelector('.btn-config').href = 'games/' + g.path + '/admin.html';
                grid.appendChild(card);
            });

            // 실수로 지우지 않게 두 번 눌러야 지워진다
            const clearBtn = document.getElementById('clearRecords');
            let armed = false;
            clearBtn.addEventListener('click', function () {
                if (!armed) {
                    armed = true;
                    clearBtn.textContent = '한 번 더 누르면 모든 기록이 지워져요';
                    setTimeout(function () {
                        armed = false;
                        clearBtn.textContent = '모든 게임의 별과 최고 기록 지우기';
                    }, 3000);
                    return;
                }
                try {
                    localStorage.removeItem('arcade_records');
                } catch (e) {
                    /* 저장소를 쓸 수 없는 환경 */
                }
                location.reload();
            });
        })();
    </script>
</body>

</html>
