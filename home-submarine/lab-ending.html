<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>결말 시험대 - 잠수함 간식호</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ending.css">
    <style>
        body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        #root { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    </style>
</head>

<body>
    <!--
      결말 화면과 관찰 리포트만 따로 띄워 보는 개발용 화면. 가상의 아이가 엔진을 실제로 돌려 상태를 만든다.
      실제 게임과 같은 저장소(localStorage)에 진행과 기록을 남기므로, 진행 중인 임무가 있는 기기에서는 열지 않는다.
      예: lab-ending.html?d=1&seed=7&case=clean|rough|sunk|forced&view=ending|report&debug=1
      그 밖에: reset=1 (진행과 기록을 지우고 새로), name=함장이름 (빈 값이면 이름 없음), rooms=4|5|6,
              bonus=A|S|always|none, btext=보너스 문구, treasure=lock|place|key|text, ttext=보물 문구,
              predict=0 (예측 없음) 또는 predict=damage,retry,hardest (예: 1,0,deep), no=임무 번호, rescue=1 (인양에서 부모 도움)
    -->
    <div id="root"></div>
    <script type="module" src="js/play/lab-ending.js"></script>
</body>

</html>
